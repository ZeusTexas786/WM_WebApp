pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    limit_req_zone $http_x_forwarded_for zone=requests:10m rate=5r/s;
    limit_conn_zone $http_x_forwarded_for zone=connections:10m;
    server {
        listen 8080;
        client_max_body_size 302m;
        client_body_timeout 30s;
        send_timeout 30s;
        limit_conn connections 4;
        limit_req zone=requests burst=20 nodelay;
        limit_req_status 429;
        location /static/ {
            alias /static/;
            add_header X-Content-Type-Options nosniff always;
        }
        location /health/ { return 404; }
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
            proxy_request_buffering off;
        }
    }
}
